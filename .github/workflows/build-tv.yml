name: Build Android TV APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android-tv/**'
      - '.github/workflows/build-tv.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 ndk;21.3.6528147'

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android-tv/local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x android-tv/gradlew

      - name: Build debug APK
        working-directory: android-tv
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ekamra-tv-apk
          path: android-tv/app/build/outputs/apk/debug/*.apk
          retention-days: 30
